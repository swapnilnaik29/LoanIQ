<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoanIQ - Merchant Sign In</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div style="display:flex; justify-content:center; align-items:center; gap:0.5rem; margin-bottom:1rem;">
      <span class="brand-logo" style="font-size:1.5rem; padding:0.4rem 0.8rem;">LoanIQ</span>
    </div>
    <h2 style="color:var(--dark-navy); margin-bottom:0.25rem;">Merchant Sign In</h2>
    <p style="color:var(--text-secondary); font-size:0.875rem; margin-bottom:1.25rem;">Select your business account to access credit advisory.</p>

    <div id="merchant-selector-container" class="login-merchant-select">
      <div style="padding:1.5rem; color:var(--text-secondary); font-size:0.875rem;">Loading authorized merchants...</div>
    </div>

    <button id="login-submit-btn" class="btn btn-primary" style="width:100%; padding:0.75rem; font-size:1rem;" disabled>
      Sign In to LoanIQ
    </button>
  </div>

  <script type="module">
    import { api } from "./js/api.js";
    import { setCurrentMerchant } from "./js/auth.js";

    let selectedMerchantId = null;

    async function loadMerchants() {
      const container = document.getElementById("merchant-selector-container");
      const submitBtn = document.getElementById("login-submit-btn");

      try {
        const res = await api.auth.getAvailableMerchants();
        const merchants = res.merchants || [];

        if (merchants.length === 0) {
          container.innerHTML = `<p style="color:var(--accent-red);">No merchants found in dataset.</p>`;
          return;
        }

        container.innerHTML = merchants.map((m, idx) => `
          <div class="merchant-pill ${idx === 0 ? 'selected' : ''}" data-id="${m.merchant_id}">
            <div>
              <div style="font-weight:700; color:var(--dark-navy);">${m.business_name}</div>
              <div style="font-size:0.75rem; color:var(--text-secondary);">${m.city} • ${m.merchant_type.replace('_', ' ')}</div>
            </div>
            <span class="badge badge-blue">${m.merchant_id}</span>
          </div>
        `).join("");

        selectedMerchantId = merchants[0].merchant_id;
        submitBtn.disabled = false;

        container.querySelectorAll(".merchant-pill").forEach(pill => {
          pill.addEventListener("click", () => {
            container.querySelectorAll(".merchant-pill").forEach(p => p.classList.remove("selected"));
            pill.classList.add("selected");
            selectedMerchantId = pill.getAttribute("data-id");
          });
        });

      } catch (err) {
        container.innerHTML = `<p style="color:var(--accent-red);">Failed to connect to backend: ${err.message}</p>`;
      }
    }

    document.getElementById("login-submit-btn").addEventListener("click", async () => {
      if (!selectedMerchantId) return;
      const btn = document.getElementById("login-submit-btn");
      btn.disabled = true;
      btn.textContent = "Authenticating...";

      try {
        const res = await api.auth.login(selectedMerchantId);
        if (res.authenticated) {
          setCurrentMerchant(res.merchant_id, res.profile);
          window.location.href = "/";
        }
      } catch (err) {
        alert("Login failed: " + err.message);
        btn.disabled = false;
        btn.textContent = "Sign In to LoanIQ";
      }
    });

    loadMerchants();
  </script>
</body>
</html>
